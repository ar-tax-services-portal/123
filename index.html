    <script type="text/javascript">
      // Single Page Apps for GitHub Pages - Path Restoration
      // MIT License - https://github.com/rafgraph/spa-github-pages
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
    <script>
      // Narrowed filter: ONLY suppress confirmed third-party browser extension injection noise (e.g. MetaMask extension in iframe)
      // Never suppress genuine application, Firebase, API, authentication, or React rendering errors.
      (function() {
        var isConfirmedExtensionNoise = function(msg, source, stack) {
          var text = ((msg || '') + ' ' + (source || '') + ' ' + (stack || '')).toLowerCase();
          
          // Never suppress genuine application, Firebase, backend API, or local code errors
          if (
            text.indexOf('/src/') !== -1 ||
            text.indexOf('artaxserv.com') !== -1 ||
            text.indexOf('/api/') !== -1 ||
            text.indexOf('firebase') !== -1 ||
            text.indexOf('firestore') !== -1 ||
            text.indexOf('googleapis') !== -1 ||
            text.indexOf('react') !== -1
          ) {
            return false;
          }

          // Must originate from an extension protocol or known wallet injection script
          var isExtensionProtocol = 
            text.indexOf('chrome-extension://') !== -1 ||
            text.indexOf('moz-extension://') !== -1 ||
            text.indexOf('safari-web-extension://') !== -1;

          var isKnownWalletError = 
            text.indexOf('failed to connect to metamask') !== -1 ||
            text.indexOf('metamask: the event') !== -1 ||
            text.indexOf('metamask-contentscript') !== -1 ||
            text.indexOf('evm-ask-provider') !== -1;

          return isExtensionProtocol || isKnownWalletError;
        };

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason;
          var msg = (reason && (reason.message || String(reason))) || '';
          var stack = (reason && reason.stack) || '';
          if (isConfirmedExtensionNoise(msg, '', stack)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || (e.error && e.error.message))) || '';
          var source = (e && e.filename) || '';
          var stack = (e && e.error && e.error.stack) || '';
          if (isConfirmedExtensionNoise(msg, source, stack)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
